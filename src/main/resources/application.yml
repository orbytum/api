spring:
  application:
    name: api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

# JWT (extracted from .env)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

# Password Configuration
security:
  password:
    saltLength: 16
    hashLength: 32
    parallelism: 1
    memory: 16384
    iterations: 2

# JPA, ORM Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.hibernate.orm.results: TRACE